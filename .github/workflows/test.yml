name: test
on:
  push:
    branches: [main, release, "feature/**"]
  pull_request:
    branches: [main, release]

permissions:
  contents: read

jobs:
  branch-flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the branch flow
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          case "$BASE_REF:$HEAD_REF" in
            main:release|release:feature/*|release:main)
              echo "Allowed pull request flow: $HEAD_REF -> $BASE_REF"
              ;;
            *)
              echo "::error title=Invalid pull request flow::Allowed: release -> main; feature/* -> release; main -> release (synchronization). Received: $HEAD_REF -> $BASE_REF"
              exit 1
              ;;
          esac

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run verify:manifests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
