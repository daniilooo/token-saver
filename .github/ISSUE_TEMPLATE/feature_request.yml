name: Feature request
description: Propose a problem-focused improvement without promising unverified behavior.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private logs, or sensitive project output.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem and affected workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include a sanitized example and expected limits.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgement
      options:
        - label: I understand that security-sensitive output and real logs must not be posted publicly.
          required: true
